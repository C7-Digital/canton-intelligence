<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #F0F2F4;
    --surface: #ffffff;
    --surface2: #F7F9FB;
    --border: #E7E9EB;
    --b2: #D7D9DB;
    --text: #58595B;
    --muted: #939597;
    --ink: #191B1C;
    --accent: #406E90;
    --accent2: #325170;
    --yellow: #DFD800;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 18px 32px 14px;
    display: flex;
    align-items: center;
    border-bottom: 1px solid var(--b2);
    flex-shrink: 0;
    background: #ffffff;
    backdrop-filter: blur(12px);
    z-index: 10;
  }
  .logo-area h1 {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    letter-spacing: 0.01em;
    color: var(--text);
    display: inline-block;
    border-bottom: 3px solid var(--yellow);
    padding-bottom: 2px;
  }
  .logo-area p {
    font-size: 11px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-top: 2px;
  }
  .header-stats { display: flex; gap: 28px; align-items: center; margin-left: auto; }
  .c7-mark { display: flex; align-items: center; flex-shrink: 0; }
  .c7-mark img.c7-logo { display: block; height: 30px; width: auto; }
  .h-divider { width: 1px; height: 30px; background: var(--b2); flex-shrink: 0; }
  .stat { text-align: right; }
  .stat-num {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    color: var(--accent);
    line-height: 1;
  }
  .stat-label {
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-family: 'DM Mono', monospace;
  }
  .breadcrumb {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 32px;
    font-size: 12px;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.05em;
    min-height: 38px;
  }
  .breadcrumb span.active { color: var(--text); }
  .breadcrumb .sep { color: var(--border); }
  .back-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    cursor: pointer;
    padding: 3px 10px;
    font-size: 11px;
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.06em;
    border-radius: 3px;
    transition: all 0.15s;
    display: none;
  }
  .back-btn:hover { color: var(--text); border-color: var(--muted); }
  .back-btn.visible { display: inline-block; }
  #main { flex: 1; overflow: hidden; position: relative; }
  #svg-container { width: 100%; height: 100%; }
  .cat-bubble { cursor: pointer; }
  .cat-bubble circle.bg { transition: opacity 0.2s; }
  .cat-bubble:hover circle.bg { opacity: 0.85; }
  .cat-bubble:hover text { fill: #191B1C; }
  .cat-label {
    fill: #191B1C;
    font-family: 'DM Mono', monospace;
    font-weight: 500;
    text-anchor: middle;
    pointer-events: none;
    dominant-baseline: central;
  }
  .cat-count {
    fill: rgba(25,27,28,0.55);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    text-anchor: middle;
    pointer-events: none;
  }
  #company-view {
    display: none;
    width: 100%;
    height: 100%;
    padding: 24px 32px;
    overflow-y: auto;
  }
  #company-view.visible { display: block; }
  .company-header {
    display: flex;
    align-items: baseline;
    gap: 16px;
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .company-header h2 {
    font-family: 'Playfair Display', serif;
    font-size: 26px;
    color: var(--text);
  }
  .company-header .cat-count-big {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: var(--muted);
  }
  #search-box {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 14px;
    font-size: 13px;
    font-family: 'DM Mono', monospace;
    border-radius: 4px;
    width: 260px;
    outline: none;
    margin-left: auto;
  }
  #search-box:focus { border-color: var(--accent); }
  #search-box::placeholder { color: var(--muted); }
  .company-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 8px;
  }
  .company-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 14px;
    transition: border-color 0.15s, background 0.15s;
  }
  .company-card:hover {
    border-color: var(--accent);
    background: var(--surface2);
  }
  .company-card a {
    color: var(--text);
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
    display: block;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .company-card a:hover { color: var(--accent); }
  .company-card .co-country {
    font-size: 10px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    margin-top: 3px;
  }
  .company-card .co-desc {
    font-size: 11px;
    color: #6B6D6F;
    line-height: 1.5;
    margin-top: 6px;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  #tooltip {
    position: fixed;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 12px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.12s;
    z-index: 999;
    max-width: 200px;
    font-family: 'DM Mono', monospace;
  }
  #tooltip.show { opacity: 1; }
  #tooltip strong { display: block; color: var(--text); margin-bottom: 2px; }
  #tooltip span { color: var(--muted); font-family: 'DM Mono', monospace; font-size: 11px; }
  #view-hint {
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.08em;
    pointer-events: none;
  }
  /* Legend */
  #legend {
    position: absolute;
    top: 16px;
    right: 20px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    pointer-events: none;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 10px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
  }
  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
</style>

  'Blockchain Infrastructure / Validator': '#406E90',
  'General Web3 / Blockchain':            '#558FB3',
  'DeFi / Lending / Yield':              '#5f7d00',
  'Crypto Exchange / Trading Platform':  '#7a9a00',
  'Digital Asset Custody / Wallet':      '#4a5800',
  'Tokenization / RWA':                  '#D52F41',
  'Stablecoin / Payments':               '#B12433',
  'Asset Manager / Regulated Financial Services': '#8B2030',
  'Bank / TradFi Institution':           '#D52F41',
  'Fintech':                             '#8B007E',
  'Data & Analytics / Oracle':           '#609CBF',
  'Identity / KYC / Compliance / RegTech': '#325170',
  'Security / Audit':                    '#05365C',
  'Consulting / Advisory / Professional Services': '#497EA2',
  'Venture / Investment':                '#325170',
  'Technology / IT Company':             '#558FB3',
  'Software / Tech / Developer Studio':  '#7B4B94',

function getCatColor(cat) { return CAT_COLORS[cat] || '#939597'; }

function getBucket(cat) {
  for (const [b, cats] of Object.entries(BUCKETS)) {
    if (cats.includes(cat)) return b;
  }
  return 'Other / Niche';
}

// Build nodes
const nodes = Object.entries(RAW).map(([cat, companies]) => ({
  id: cat,
  count: companies.length,
  companies,
}));

const tooltip = document.getElementById('tooltip');

function showTooltip(evt, d) {
  tooltip.innerHTML = `<strong>${d.id}</strong><span>${d.count} participants</span>`;
  tooltip.classList.add('show');
  moveTooltip(evt);
}
function moveTooltip(evt) {
  tooltip.style.left = (evt.clientX + 14) + 'px';
  tooltip.style.top = (evt.clientY - 10) + 'px';
}
function hideTooltip() { tooltip.classList.remove('show'); }

let currentCat = null;

function showOverview() {
  currentCat = null;
  document.getElementById('company-view').classList.remove('visible');
  document.getElementById('company-view').innerHTML = '';
  document.getElementById('svg-container').style.display = '';
  document.getElementById('legend').style.display = '';
  document.querySelector('#breadcrumb .view-hint') && null;
  document.getElementById('back-btn').classList.remove('visible');
  document.getElementById('bc-sep').style.display = 'none';
  document.getElementById('bc-cat').textContent = '';
  document.getElementById('view-hint').style.display = '';
}

function esc(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function showCategory(cat) {
  currentCat = cat;
  document.getElementById('svg-container').style.display = 'none';
  document.getElementById('legend').style.display = 'none';
  document.getElementById('view-hint').style.display = 'none';
  document.getElementById('bc-sep').style.display = '';
  document.getElementById('bc-cat').textContent = cat;
  document.getElementById('back-btn').classList.add('visible');

  const companies = RAW[cat];
  const cv = document.getElementById('company-view');
  cv.classList.add('visible');

  const cards = companies.map(c => {
    const hasUrl = c.url && c.url !== 'nan' && c.url.startsWith('http');
    const nameEl = hasUrl
      ? `<a href="${esc(c.url)}" target="_blank" rel="noopener" title="${esc(c.name)}">${esc(c.name)}</a>`
      : `<a title="${esc(c.name)}">${esc(c.name)}</a>`;
    const countryEl = c.country && c.country !== 'nan'
      ? `<div class="co-country">${esc(c.country)}</div>` : '';
    const descEl = c.desc && c.desc.trim()
      ? `<div class="co-desc">${esc(c.desc)}</div>` : '';
    return `<div class="company-card" data-name="${esc(c.name.toLowerCase())}">${nameEl}${countryEl}${descEl}</div>`;
  }).join('');

  cv.innerHTML = `
    <div class="company-header">
      <h2>${esc(cat)}</h2>
      <span class="cat-count-big">${companies.length} participants</span>
      <input id="search-box" type="text" placeholder="Search companies…" oninput="filterCompanies(this.value)">
    </div>
    <div class="company-grid" id="company-grid">${cards}</div>
  `;
}

window.filterCompanies = function(q) {
  const lq = q.toLowerCase();
  document.querySelectorAll('.company-card').forEach(card => {
    card.style.display = card.dataset.name.includes(lq) ? '' : 'none';
  });
};

// Draw bubble chart
function drawBubbles() {
  const container = document.getElementById('svg-container');
  const W = container.clientWidth;
  const H = container.clientHeight;

  d3.select('#svg-container').selectAll('*').remove();

  const svg = d3.select('#svg-container').append('svg')
    .attr('width', W).attr('height', H);

  const defs = svg.append('defs');

  // Background gradient
  const radialGrad = defs.append('radialGradient').attr('id', 'bgGrad')
    .attr('cx', '50%').attr('cy', '50%').attr('r', '70%');
  radialGrad.append('stop').attr('offset', '0%').attr('stop-color', '#F7F9FB').attr('stop-opacity', 1);
  radialGrad.append('stop').attr('offset', '100%').attr('stop-color', '#F0F2F4').attr('stop-opacity', 1);
  svg.append('rect').attr('width', W).attr('height', H).attr('fill', 'url(#bgGrad)');

  // Glow filter
  const filter = defs.append('filter').attr('id', 'glow').attr('x', '-20%').attr('y', '-20%').attr('width', '140%').attr('height', '140%');
  filter.append('feGaussianBlur').attr('stdDeviation', '3').attr('result', 'blur');
  const merge = filter.append('feMerge');
  merge.append('feMergeNode').attr('in', 'blur');
  merge.append('feMergeNode').attr('in', 'SourceGraphic');

  // Pack layout
  const pack = d3.pack()
    .size([W - 40, H - 40])
    .padding(14);

  const root = d3.hierarchy({ children: nodes })
    .sum(d => d.count ? Math.sqrt(d.count) * 8 : 0);

  pack(root);

  const g = svg.append('g').attr('transform', 'translate(20,20)');

  const bubbles = g.selectAll('.cat-bubble')
    .data(root.leaves())
    .join('g')
    .attr('class', 'cat-bubble')
    .attr('transform', d => `translate(${d.x},${d.y})`)
    .style('cursor', 'pointer')
    .on('click', (evt, d) => showCategory(d.data.id))
    .on('mouseenter', (evt, d) => showTooltip(evt, d.data))
    .on('mousemove', moveTooltip)
    .on('mouseleave', hideTooltip);

  // Outer glow ring
  bubbles.append('circle')
    .attr('r', d => d.r + 5)
    .attr('fill', 'none')
    .attr('stroke', d => getCatColor(d.data.id))
    .attr('stroke-width', 1)
    .attr('opacity', 0.15);

  // Main fill circle
  bubbles.append('circle')
    .attr('class', 'bg')
    .attr('r', d => d.r)
    .attr('fill', d => getCatColor(d.data.id))
    .attr('fill-opacity', 0.18)
    .attr('stroke', d => getCatColor(d.data.id))
    .attr('stroke-width', 1.5)
    .attr('stroke-opacity', 0.75)
    .attr('filter', 'url(#glow)');

  // Labels
  bubbles.each(function(d) {
    const el = d3.select(this);
    const r = d.r;
    const label = d.data.id.split(' / ')[0];
    const count = d.data.count;
    const fontSize = Math.max(9, Math.min(14, r / 4.5));

    if (r > 22) {
      const words = label.split(' ');
      const lineH = fontSize * 1.3;
      let lines = [], line = '';
      const maxW = r * 1.6;
      words.forEach(w => {
        const test = line ? line + ' ' + w : w;
        if (test.length * fontSize * 0.58 > maxW && line) {
          lines.push(line); line = w;
        } else { line = test; }
      });
      if (line) lines.push(line);

      const showCount = r > 35;
      const totalH = lines.length * lineH + (showCount ? lineH : 0);
      const startY = -totalH / 2 + lineH / 2;

      lines.forEach((ln, i) => {
        el.append('text')
          .attr('class', 'cat-label')
          .attr('y', startY + i * lineH)
          .attr('font-size', fontSize)
          .text(ln);
      });

      if (showCount) {
        el.append('text')
          .attr('class', 'cat-count')
          .attr('y', startY + lines.length * lineH + 2)
          .attr('font-size', Math.max(9, fontSize * 0.8))
          .text(count);
      }
    }
  });

  // Entrance animation
  g.selectAll('.cat-bubble circle.bg')
    .attr('r', 0)
    .transition().duration(700).delay((d, i) => i * 30).ease(d3.easeCubicOut)
    .attr('r', d => d.r);

  g.selectAll('.cat-bubble text')
    .attr('opacity', 0)
    .transition().duration(400).delay((d, i) => 400 + i * 30)
    .attr('opacity', 1);

  // Build legend
  const legend = document.getElementById('legend');
  legend.innerHTML = Object.entries(BUCKET_COLORS).map(([b, col]) =>
    `<div class="legend-item">
      <div class="legend-dot" style="background:${col}"></div>
      <span>${b}</span>
    </div>`
  ).join('');
}

drawBubbles();
window.addEventListener('resize', () => { if (!currentCat) drawBubbles(); });
</script>
