<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F0F2F4;--s1:#ffffff;--s2:#F7F9FB;--s3:#E7F2F6;
  --b:#E7E9EB;--b2:#D7D9DB;--text:#58595B;--muted:#939597;--muted2:#6B6D6F;--ink:#191B1C;
  --blue:#406E90;--blue2:#325170;--green:#5f7d00;--red:#D52F41;--purple:#05365C;--pink:#8B007E;--yellow:#DFD800;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px}
a{color:var(--blue);text-decoration:none}

/* HEADER */
#header{position:fixed;top:0;left:0;right:0;height:56px;z-index:100;background:#ffffff;border-bottom:1px solid var(--b2);display:flex;align-items:center;gap:18px;padding:0 22px}
.c7-mark img{display:block;height:30px;width:auto}
.h-divider{width:1px;height:30px;background:var(--b2);flex-shrink:0}
#header h1{font-family:'Playfair Display',serif;font-size:19px;color:var(--ink);white-space:nowrap;border-bottom:3px solid var(--yellow);padding-bottom:2px}
.h-sub{font-family:'DM Mono',monospace;font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;margin-top:2px}
.hstats{display:flex;gap:22px;margin-left:auto}
.hstat{text-align:center}
.hstat-n{font-family:'Playfair Display',serif;font-size:20px;color:var(--blue);line-height:1}
.hstat-l{font-family:'DM Mono',monospace;font-size:7.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-top:1px}

/* TABS */
#tabs{position:fixed;top:56px;left:0;right:0;height:40px;z-index:99;background:var(--s2);border-bottom:1px solid var(--b);display:flex;align-items:flex-end;padding:0 22px;gap:2px}
.tab{padding:6px 16px;font-family:'DM Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted2);cursor:pointer;border-bottom:2px solid transparent;transition:.15s;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--blue2);border-bottom-color:var(--blue)}
.tab-num{opacity:.55;margin-left:4px;font-size:8px}

#body{position:fixed;top:96px;left:0;right:0;bottom:0;overflow:hidden}
.view{display:none;height:100%;overflow-y:auto;padding:20px 24px}
.view.on{display:block}
.view::-webkit-scrollbar{width:5px}
.view::-webkit-scrollbar-thumb{background:var(--b2);border-radius:3px}

/* CARDS + GRID */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;align-content:start}
.card{background:var(--s1);border:1px solid var(--b);border-radius:8px;padding:16px 18px}
.card h3{font-family:'Playfair Display',serif;font-size:15px;color:var(--ink);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--b)}
.big{font-family:'Playfair Display',serif;font-size:30px;color:var(--blue);line-height:1}
.lbl{font-family:'DM Mono',monospace;font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-top:2px}

/* BARS */
.brow{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.blab{font-family:'DM Mono',monospace;font-size:9px;color:var(--muted2);width:88px;flex-shrink:0;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btrk{flex:1;background:var(--bg);border-radius:2px;height:11px;overflow:hidden}
.bfill{height:11px;border-radius:2px}
.bnum{font-family:'DM Mono',monospace;font-size:9px;color:var(--muted);min-width:26px}

/* TABLE */
table{width:100%;border-collapse:collapse;background:var(--s1);border:1px solid var(--b);border-radius:8px;overflow:hidden}
thead th{position:sticky;top:0;padding:8px 12px;text-align:left;font-family:'DM Mono',monospace;font-size:8.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted2);background:var(--s2);border-bottom:1px solid var(--b2);white-space:nowrap;cursor:pointer;user-select:none;z-index:5}
tbody tr{border-bottom:1px solid var(--b)}
tbody tr:hover{background:var(--s2)}
tbody td{padding:7px 12px;vertical-align:top}
.mono{font-family:'DM Mono',monospace;font-size:10px}
.pill{display:inline-block;padding:1px 7px;border-radius:3px;font-size:8px;font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.p-executed{background:#F5FBE7;color:#4a5800}
.p-rejected{background:#fde8ea;color:#D52F41}
.p-expired{background:#F0F2F4;color:#6B6D6F}
.p-in_progress{background:#FBFAE4;color:#6a6400}
.p-kind{background:var(--s3);color:var(--blue2)}
.votes-ar{font-family:'DM Mono',monospace;font-size:10px;white-space:nowrap}
.va{color:var(--green)}.vr{color:var(--red)}

/* toolbar */
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.toolbar input,.toolbar select{background:var(--s1);border:1px solid var(--b2);border-radius:4px;padding:5px 10px;color:var(--ink);font-family:'DM Mono',monospace;font-size:10px;outline:none}
.toolbar input{flex:1;min-width:180px}
.count{font-family:'DM Mono',monospace;font-size:9px;color:var(--muted);white-space:nowrap}

/* key vote cards */
.kv-card{background:var(--s1);border:1px solid var(--b);border-left:3px solid var(--blue);border-radius:8px;padding:16px 18px;margin-bottom:14px}
.kv-card.red{border-left-color:var(--red)}
.kv-card.green{border-left-color:var(--green)}
.kv-title{font-family:'Playfair Display',serif;font-size:16px;color:var(--ink)}
.kv-meta{font-family:'DM Mono',monospace;font-size:8.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:4px 0 10px}
.kv-body{font-size:12px;line-height:1.65;color:var(--muted2);margin-bottom:10px}
.kv-body strong{color:var(--ink)}
.ballot{display:flex;flex-wrap:wrap;gap:5px}
.bv{font-family:'DM Mono',monospace;font-size:8.5px;padding:2px 8px;border-radius:3px;border:1px solid}
.bv-a{background:#F5FBE7;border-color:#cfe0a0;color:#4a5800}
.bv-r{background:#fde8ea;border-color:#f2b8c0;color:#D52F41}
.bv-n{background:var(--bg);border-color:var(--b2);color:var(--muted)}
</style>
</head>

function renderFeatured(){

  const rows=DATA.featured.filter(f=>!q||f.name.toLowerCase().includes(q))
    .sort((a,b)=>b.since.localeCompare(a.since));
  document.getElementById('f-count').textContent=rows.length+' apps';
  document.getElementById('f-tablewrap').innerHTML=`<table><thead><tr><th>App Provider</th><th>Featured Since</th><th>Tenure</th></tr></thead><tbody>`+
    rows.map(f=>{
      const days=Math.round((Date.parse('2026-08-02')-Date.parse(f.since))/86400000);
      return `<tr><td class="mono" style="color:var(--blue2)">${f.name}</td><td class="mono">${f.since}</td><td class="mono" style="color:var(--muted)">${days>=365?(days/365).toFixed(1)+' yr':days+' d'}</td></tr>`;
    }).join('')+`</tbody></table>`;
}

  <div class="card" style="grid-column:1/-1"><h3>Sponsor Concentration — which SV onboarded them</h3>${bars(V.sponsors,i=>PAL[i%PAL.length])}
  <div style="font-size:11px;color:var(--muted2);line-height:1.6;margin-top:8px">Validator licenses are sponsored by SV nodes. Sponsor share is a soft form of network influence not visible in governance weight.</div></div>
  <div class="card" style="grid-column:1/-1"><h3>NaaS Host Landscape — who operates the nodes</h3>
    ${DATA.naas.hosts.map((r,i)=>`<div class="brow"><div class="blab" style="width:150px">${r.h}</div><div class="btrk"><div class="bfill" style="width:${r.n/DATA.naas.hosts[0].n*100}%;background:${PAL[i%PAL.length]}"></div></div><div class="bnum">${r.n}</div></div>`).join('')}
    <div style="font-size:11px;color:var(--muted2);line-height:1.6;margin-top:8px">Operational host attributed from each validator's on-chain contact record (${DATA.naas.attributed.toLocaleString()} of ${fmt(DATA.validators.total)} validators carry a contact; ${DATA.naas.no_contact.toLocaleString()} have none; ${DATA.naas.self.toLocaleString()} attribute to their own/other domains — self-operated). Distinct from sponsorship: the sponsor licenses the validator, the NaaS host runs it — IntellectEU Catalyst, MPCH, Proof Group, Figment and Five North together operate the large majority of attributable third-party nodes.</div></div>`;

// tabs
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));
  t.classList.add('on');
  document.getElementById('v-'+t.dataset.view).classList.add('on');
}));
</script>
</body>
</html>
